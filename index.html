<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Seite</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      display: flex;
    }
    nav {
      width: 200px;
      min-height: 100vh;
      background-color: #2c3e50;
      padding-top: 40px;
      flex-shrink: 0;
    }
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      font-weight: bold;
    }
    nav a:hover {
      background-color: #3498db;
    }
    main {
      padding: 40px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }
    h2 {
      color: #2c3e50;
      margin-top: 30px;
    }
    .entry {
      margin-bottom: 15px;
    }
    .zeitraum {
      font-weight: bold;
      color: #3498db;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#lebenslauf">Lebenslauf</a>
  </nav>

  <main>
    <h1 id="lebenslauf">Lebenslauf</h1>

    <h2>Ausbildung</h2>
    <div class="entry">
      <div class="zeitraum">1999 bis 2006</div>
      <div>Studium der Holzwirtschaft, Universität Hamburg</div>
    </div>
    <div class="entry">
      <div class="zeitraum">2002 bis 2003</div>
      <div>Studium Wood Science, Virginia Tech</div>
    </div>

    <h2>Praktikum</h2>
    <div class="entry">
      <div class="zeitraum">2003</div>
      <div>Weyerhaeuser Paper Mill, Johnsonburg, Pennsylvania</div>
    </div>

    <h2>Beruflicher Werdegang</h2>
    <div class="entry">
      <div class="zeitraum">2009 bis heute</div>
      <div>Softwareentwickler, Brückmann Software</div>
    </div>
  </main>

</body>
</html>
